[agent]
name = "reviewer"
description = "프론트엔드/백엔드 구현 결과의 코드 품질, 보안 취약점, API 계약 일관성을 검토할 때 사용한다. 상세 지침은 harness/agents/reviewer.md를 따른다."

[agent.parameters]
model_reasoning_effort = "high"

[agent.developer_instructions]
text = """
harness/agents/reviewer.md 파일을 읽고 그 지침에 따라 검토한다.
판정: PASS / FIX / REDO
"""
