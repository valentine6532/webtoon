<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>묵혼 1화</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      color: #202124;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { width: 100%; max-width: 760px; padding: 24px 16px 14px; text-align: center; }
    header h1 { font-size: 1.55rem; color: #202124; margin-bottom: 5px; }
    header p { font-size: 0.86rem; color: #5f6368; }
    .episode-title {
      width: 100%;
      max-width: 760px;
      padding: 12px 16px 16px;
      text-align: center;
      font-size: 1.08rem;
      color: #3c4043;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 4px;
    }
    .panels { width: 100%; max-width: 760px; display: flex; flex-direction: column; }
    .panel img { width: 100%; display: block; background: #fff; }
    footer {
      width: 100%;
      max-width: 760px;
      padding: 24px 16px 34px;
      text-align: center;
      color: #80868b;
      font-size: 0.82rem;
      border-top: 1px solid #e0e0e0;
      margin-top: 8px;
    }
    footer a { color: #3c4043; }
  </style>
</head>
<body>
  <header>
    <h1>묵혼</h1>
    <p>세로 스크롤 웹툰 뷰어</p>
  </header>
  <div class="episode-title">1화</div>

  <main class="panels" id="episode" aria-label="묵혼 1화 패널"></main>

  <footer>
    묵혼 1화 · 총 44패널<br><br>
    <a href="../index.html">묵혼 목록</a> · <a href="../../../index.html">전체 목록</a>
  </footer>

  <script>
    const episode = document.getElementById("episode");
    const fragment = document.createDocumentFragment();

    Array.from({ length: 44 }, (_, index) => index + 1).forEach((number) => {
      const section = document.createElement("section");
      section.className = "panel";

      const img = document.createElement("img");
      img.src = `assets/panel_${String(number).padStart(3, "0")}.png`;
      img.alt = `묵혼 1화 패널 ${number}`;
      img.loading = number <= 3 ? "eager" : "lazy";

      section.appendChild(img);
      fragment.appendChild(section);
    });

    episode.appendChild(fragment);
  </script>
</body>
</html>
