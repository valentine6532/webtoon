<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hunter Episodes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #fff;
      color: #202124;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header, main {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 34px 20px 0;
    }
    .eyebrow {
      color: #5f6368;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 { font-size: clamp(2rem, 7vw, 3.3rem); line-height: 1.1; font-weight: 850; }
    .tagline { max-width: 640px; margin-top: 12px; color: #5f6368; line-height: 1.65; }
    .section-title {
      color: #5f6368;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
      margin: 26px 0 16px;
    }
    .episode-card {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 18px;
      align-items: center;
      padding: 16px;
      color: inherit;
      text-decoration: none;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .episode-card:hover {
      border-color: #9aa0a6;
      box-shadow: 0 8px 22px rgba(60, 64, 67, 0.14);
      transform: translateY(-2px);
    }
    .thumb { width: 112px; height: 112px; object-fit: cover; border-radius: 6px; background: #f1f3f4; }
    .ep-num { color: #5f6368; font-size: 0.76rem; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 6px; }
    .ep-title { font-size: 1.18rem; font-weight: 800; margin-bottom: 7px; }
    .ep-desc { color: #5f6368; font-size: 0.9rem; line-height: 1.6; }
    footer { color: #80868b; text-align: center; padding: 30px 20px 42px; font-size: 0.82rem; }
    footer a { color: #3c4043; }
    @media (max-width: 560px) {
      .episode-card { grid-template-columns: 82px 1fr; gap: 14px; }
      .thumb { width: 82px; height: 82px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Hunter Series</div>
    <h1>Hunter</h1>
    <p class="tagline">생성된 에피소드를 선택해서 흰색 배경의 세로 스크롤 뷰어로 볼 수 있습니다.</p>
  </header>

  <main>
    <h2 class="section-title">Episodes</h2>
    <a href="episode01/" class="episode-card">
      <img class="thumb" src="episode01/assets/panel_001.png" alt="Hunter 1화 썸네일">
      <div>
        <div class="ep-num">EP. 01</div>
        <div class="ep-title">Hunter 1화</div>
        <div class="ep-desc">총 40개 패널로 구성된 첫 번째 에피소드입니다.</div>
      </div>
    </a>
  </main>

  <footer><a href="../../index.html">전체 목록으로 돌아가기</a></footer>
</body>
</html>
