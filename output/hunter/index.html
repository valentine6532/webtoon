<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hunter Episodes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #101112;
      color: #f1efe8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 42px 18px 30px;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(21, 35, 28, 0.58), rgba(16, 17, 18, 0.96)),
        url("episode01/assets/panel_001.png") center 42% / cover;
      border-bottom: 1px solid #2a2d2b;
      position: relative;
    }
    header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
    }
    header > * {
      position: relative;
      z-index: 1;
    }
    .eyebrow {
      color: #f5c542;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h1 {
      font-size: clamp(2rem, 7vw, 3.6rem);
      line-height: 1.1;
      font-weight: 800;
      text-shadow: 0 2px 14px rgba(0,0,0,0.75);
    }
    .tagline {
      max-width: 680px;
      margin: 14px auto 0;
      color: #d7d1c4;
      font-size: 0.96rem;
      line-height: 1.7;
    }
    main {
      max-width: 860px;
      margin: 34px auto;
      padding: 0 20px;
    }
    .section-title {
      color: #928d82;
      font-size: 0.78rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding-bottom: 12px;
      border-bottom: 1px solid #292b2b;
      margin-bottom: 18px;
    }
    .episode-card {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 18px;
      align-items: center;
      padding: 16px;
      color: inherit;
      text-decoration: none;
      background: #171918;
      border: 1px solid #2b302d;
      border-radius: 8px;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .episode-card:hover {
      background: #202421;
      border-color: #6f7042;
      transform: translateX(4px);
    }
    .thumb {
      width: 112px;
      height: 112px;
      object-fit: cover;
      border-radius: 6px;
      background: #252725;
    }
    .ep-num {
      color: #f5c542;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .ep-title {
      font-size: 1.18rem;
      font-weight: 800;
      margin-bottom: 7px;
    }
    .ep-desc {
      color: #aaa397;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .footer {
      color: #68675f;
      text-align: center;
      padding: 30px 20px 42px;
      font-size: 0.82rem;
    }
    .footer a { color: #8b897b; }
    @media (max-width: 560px) {
      .episode-card {
        grid-template-columns: 82px 1fr;
        gap: 14px;
      }
      .thumb {
        width: 82px;
        height: 82px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Hunter Series</div>
    <h1>Hunter</h1>
    <p class="tagline">헌터시험_1 에피소드를 선택해서 볼 수 있습니다.</p>
  </header>

  <main>
    <h2 class="section-title">Episodes</h2>
    <a href="episode01/" class="episode-card">
      <img class="thumb" src="episode01/assets/panel_001.png" alt="Hunter episode 01 thumbnail">
      <div>
        <div class="ep-num">EP. 01</div>
        <div class="ep-title">섬을 떠나다</div>
        <div class="ep-desc">총 40컷으로 구성된 헌터시험_1 첫 번째 에피소드입니다.</div>
      </div>
    </a>
  </main>

  <footer class="footer">
    <a href="../../index.html">전체 목록으로 돌아가기</a>
  </footer>
</body>
</html>
