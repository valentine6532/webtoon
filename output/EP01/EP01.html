<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>흑영 EP01 - 주인을 베는 칼끝</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070707;
      color: #f4f1ec;
      font-family: "Nanum Gothic", system-ui, sans-serif;
    }
    .webtoon-header {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 16px 20px 14px;
      text-align: center;
      background: rgba(12, 11, 11, 0.94);
      border-bottom: 1px solid #2b2524;
      backdrop-filter: blur(10px);
    }
    .series-title {
      color: #9f8b7d;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    h1 {
      font-size: clamp(1.28rem, 4vw, 1.82rem);
      line-height: 1.28;
      font-weight: 800;
    }
    .episode-container {
      max-width: 820px;
      margin: 0 auto;
      background: #050505;
    }
    .panel {
      position: relative;
      line-height: 0;
      overflow: hidden;
      border-bottom: 12px solid #050505;
    }
    .panel img {
      width: 100%;
      display: block;
    }
    .episode-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      max-width: 820px;
      margin: 0 auto;
      padding: 26px 20px 34px;
      background: #090909;
      border-top: 1px solid #2b2524;
    }
    .episode-nav a,
    .episode-nav span {
      color: #c4b8ae;
      font-size: 0.88rem;
    }
    .episode-nav a {
      text-decoration: none;
      border: 1px solid #453a38;
      border-radius: 6px;
      padding: 10px 16px;
      background: #151313;
    }
    .episode-nav a:hover {
      border-color: #8e3838;
      background: #211918;
    }
    @media (max-width: 560px) {
      .webtoon-header { padding: 12px 14px; }
      .episode-nav {
        padding: 22px 14px 30px;
      }
    }
  </style>
</head>
<body>
  <header class="webtoon-header">
    <div class="series-title">흑영</div>
    <h1>EP.01 주인을 베는 칼끝</h1>
  </header>

  <main class="episode-container" id="episode"></main>

  <nav class="episode-nav">
    <a href="../../index.html">목록</a>
    <span>EP.01 / 40컷</span>
    <a href="#" aria-disabled="true" style="opacity:.38; pointer-events:none;">다음화</a>
  </nav>

  <script>
    const panels = Array.from({ length: 40 }, (_, index) => ({ n: index + 1, alt: `흑영 1화 ${index + 1}컷` }));

    const episode = document.getElementById("episode");
    const fragment = document.createDocumentFragment();

    panels.forEach((panel) => {
      const section = document.createElement("section");
      section.className = "panel";

      const img = document.createElement("img");
      img.src = `images/EP01_panel_${String(panel.n).padStart(2, "0")}.png`;
      img.alt = panel.alt;
      img.loading = panel.n <= 3 ? "eager" : "lazy";
      section.appendChild(img);

      fragment.appendChild(section);
    });

    episode.appendChild(fragment);
  </script>
</body>
</html>
