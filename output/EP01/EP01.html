<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EP01</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff;
      color: #202124;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .webtoon-header {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 16px 20px 14px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid #e0e0e0;
      backdrop-filter: blur(10px);
    }
    .series-title {
      color: #5f6368;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    h1 { font-size: clamp(1.28rem, 4vw, 1.82rem); line-height: 1.28; font-weight: 800; }
    .episode-container { max-width: 820px; margin: 0 auto; background: #fff; }
    .panel { position: relative; line-height: 0; overflow: hidden; }
    .panel img { width: 100%; display: block; background: #fff; }
    .episode-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      max-width: 820px;
      margin: 0 auto;
      padding: 26px 20px 34px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
    }
    .episode-nav a, .episode-nav span { color: #5f6368; font-size: 0.88rem; }
    .episode-nav a {
      text-decoration: none;
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 10px 16px;
      background: #fff;
    }
    .episode-nav a:hover { border-color: #9aa0a6; background: #f8fafd; }
    @media (max-width: 560px) {
      .webtoon-header { padding: 12px 14px; }
      .episode-nav { padding: 22px 14px 30px; }
    }
  </style>
</head>
<body>
  <header class="webtoon-header">
    <div class="series-title">EP01</div>
    <h1>EP.01</h1>
  </header>

  <main class="episode-container" id="episode" aria-label="EP01 패널"></main>

  <nav class="episode-nav">
    <a href="../../index.html">목록</a>
    <span>EP.01 / 40패널</span>
    <a href="#" aria-disabled="true" style="opacity:.38; pointer-events:none;">다음화</a>
  </nav>

  <script>
    const episode = document.getElementById("episode");
    const fragment = document.createDocumentFragment();

    Array.from({ length: 40 }, (_, index) => index + 1).forEach((number) => {
      const section = document.createElement("section");
      section.className = "panel";

      const img = document.createElement("img");
      img.src = `images/EP01_panel_${String(number).padStart(2, "0")}.png`;
      img.alt = `EP01 패널 ${number}`;
      img.loading = number <= 3 ? "eager" : "lazy";

      section.appendChild(img);
      fragment.appendChild(section);
    });

    episode.appendChild(fragment);
  </script>
</body>
</html>
