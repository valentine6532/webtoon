<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webtoon Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #fff;
      color: #202124;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      padding: 12px 14px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .episode-select {
      flex: 1 1 260px;
      width: 100%;
      max-width: 460px;
      min-width: 0;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid #d8dce0;
      border-radius: 6px;
      background: #fff;
      color: #202124;
      font: inherit;
      font-weight: 700;
    }
    .share-button {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid #202124;
      border-radius: 6px;
      background: #202124;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .share-button:focus-visible,
    .episode-select:focus-visible {
      outline: 2px solid #1a73e8;
      outline-offset: 2px;
    }
    .share-status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .episode-container {
      width: min(820px, 100%);
      margin: 0 auto;
      background: #fff;
    }
    .panel {
      line-height: 0;
      background: #fff;
    }
    .panel img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <select class="episode-select" id="episodeSelect" aria-label="Episode"></select>
    <button class="share-button" id="shareButton" type="button">Share</button>
    <span class="share-status" id="shareStatus" aria-live="polite"></span>
  </header>

  <main class="episode-container" id="episode"></main>

  <script>
    const range = (start, end) =>
      Array.from({ length: end - start + 1 }, (_, index) => start + index);

    const episodes = [
      {
        id: "ep01",
        title: "EP01",
        panels: range(1, 40),
        src: (number) => `output/EP01/images/EP01_panel_${String(number).padStart(2, "0")}.png`
      },
      {
        id: "mukhon-01",
        title: "Mukhon EP.01",
        panels: range(1, 44),
        src: (number) => `output/mukhon_1/episode01/assets/panel_${String(number).padStart(3, "0")}.png`
      },
      {
        id: "mudang-king-01",
        title: "Mudang King EP.01",
        panels: range(1, 64),
        src: (number) => `output/mudang_king_1/episode01/assets/panel_${String(number).padStart(3, "0")}.png?v=20260604`
      },
      {
        id: "mudang-king-02",
        title: "Mudang King EP.02",
        panels: range(1, 61),
        src: (number) => `output/mudang_king_1/episode02/assets/panel_${String(number).padStart(3, "0")}.png?v=20260605`
      },
      {
        id: "false-crown-01",
        title: "False Crown EP.01",
        panels: [
          ...range(1, 20),
          ...range(22, 26),
          ...range(28, 46)
        ],
        src: (number) => `output/fake_princess_1/episode01/assets/panel_${String(number).padStart(3, "0")}.png`
      },
      {
        id: "false-crown-02",
        title: "False Crown EP.02",
        panels: [
          ...range(1, 26),
          ...range(28, 46)
        ],
        src: (number) => `output/fake_princess_1/episode02/assets/panel_${String(number).padStart(3, "0")}.png?v=20260606`
      }
    ];

    const select = document.getElementById("episodeSelect");
    const shareButton = document.getElementById("shareButton");
    const shareStatus = document.getElementById("shareStatus");
    const episodeContainer = document.getElementById("episode");

    function findEpisode(id) {
      return episodes.find((item) => item.id === id) || episodes[0];
    }

    function getEpisodeIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("episode") || window.location.hash.replace(/^#/, "");
    }

    function getEpisodeUrl(id) {
      const url = new URL(window.location.href);
      url.searchParams.set("episode", id);
      url.hash = "";
      return url.toString();
    }

    function updateUrl(episode, mode = "replace") {
      const nextUrl = getEpisodeUrl(episode.id);
      const method = mode === "push" ? "pushState" : "replaceState";
      window.history[method]({ episodeId: episode.id }, "", nextUrl);
    }

    episodes.forEach((episode) => {
      const option = document.createElement("option");
      option.value = episode.id;
      option.textContent = episode.title;
      select.appendChild(option);
    });

    function renderEpisode(id, options = {}) {
      const episode = findEpisode(id);
      const { updateHistory = true, historyMode = "replace" } = options;
      const fragment = document.createDocumentFragment();

      select.value = episode.id;
      episodeContainer.innerHTML = "";
      document.title = `${episode.title} | Webtoon Viewer`;

      episode.panels.forEach((number, index) => {
        const section = document.createElement("section");
        section.className = "panel";

        const img = document.createElement("img");
        img.src = episode.src(number);
        img.alt = `${episode.title} panel ${number}`;
        img.loading = index < 3 ? "eager" : "lazy";
        img.decoding = "async";

        section.appendChild(img);
        fragment.appendChild(section);
      });

      episodeContainer.appendChild(fragment);
      shareStatus.textContent = "";

      if (updateHistory) {
        updateUrl(episode, historyMode);
      }

      window.scrollTo({ top: 0, behavior: historyMode === "push" ? "smooth" : "auto" });
    }

    select.addEventListener("change", (event) => {
      renderEpisode(event.target.value, { historyMode: "push" });
    });

    shareButton.addEventListener("click", async () => {
      const url = getEpisodeUrl(select.value);

      try {
        await navigator.clipboard.writeText(url);
        shareStatus.textContent = "Share link copied.";
        shareButton.textContent = "Copied";
        window.setTimeout(() => {
          shareButton.textContent = "Share";
        }, 1200);
      } catch (error) {
        window.prompt("Copy this share link:", url);
      }
    });

    window.addEventListener("popstate", () => {
      renderEpisode(getEpisodeIdFromUrl(), { updateHistory: false });
    });

    renderEpisode(getEpisodeIdFromUrl());
  </script>
</body>
</html>
