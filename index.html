<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webtoon Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #fff;
      color: #202124;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      padding: 12px 14px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .episode-select {
      width: min(420px, 100%);
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid #d8dce0;
      border-radius: 6px;
      background: #fff;
      color: #202124;
      font: inherit;
      font-weight: 700;
    }
    .episode-container {
      width: min(820px, 100%);
      margin: 0 auto;
      background: #fff;
    }
    .panel {
      line-height: 0;
      background: #fff;
    }
    .panel img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <select class="episode-select" id="episodeSelect" aria-label="Episode"></select>
  </header>

  <main class="episode-container" id="episode"></main>

  <script>
    const episodes = [
      {
        id: "ep01",
        title: "EP01",
        panelCount: 40,
        src: (number) => `output/EP01/images/EP01_panel_${String(number).padStart(2, "0")}.png`
      },
      {
        id: "hunter-01",
        title: "Hunter EP.01",
        panelCount: 40,
        src: (number) => `output/hunter/episode01/assets/panel_${String(number).padStart(3, "0")}.png`
      },
      {
        id: "mukhon-01",
        title: "Mukhon EP.01",
        panelCount: 44,
        src: (number) => `output/mukhon_1/episode01/assets/panel_${String(number).padStart(3, "0")}.png`
      },
      {
        id: "mudang-king-01",
        title: "Mudang King EP.01",
        panelCount: 64,
        src: (number) => `output/mudang_king_1/episode01/assets/panel_${String(number).padStart(3, "0")}.png`
      },
      {
        id: "seolgeom-01",
        title: "Seolgeom EP.01",
        panelCount: 44,
        src: (number) => `output/seolgeom_1/episode01/assets/panel_${String(number).padStart(3, "0")}.png`
      }
    ];

    const select = document.getElementById("episodeSelect");
    const episodeContainer = document.getElementById("episode");

    episodes.forEach((episode) => {
      const option = document.createElement("option");
      option.value = episode.id;
      option.textContent = episode.title;
      select.appendChild(option);
    });

    function renderEpisode(id) {
      const episode = episodes.find((item) => item.id === id) || episodes[0];
      const fragment = document.createDocumentFragment();

      select.value = episode.id;
      episodeContainer.innerHTML = "";

      for (let index = 1; index <= episode.panelCount; index += 1) {
        const section = document.createElement("section");
        section.className = "panel";

        const img = document.createElement("img");
        img.src = episode.src(index);
        img.alt = `${episode.title} ${index}`;
        img.loading = index <= 3 ? "eager" : "lazy";
        img.decoding = "async";

        section.appendChild(img);
        fragment.appendChild(section);
      }

      episodeContainer.appendChild(fragment);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    select.addEventListener("change", (event) => renderEpisode(event.target.value));
    renderEpisode(episodes[0].id);
  </script>
</body>
</html>
